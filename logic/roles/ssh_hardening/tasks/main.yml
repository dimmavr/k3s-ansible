---
# tasks file for ssh_hadening
#
- name: hardening file
  ansible.builtin.copy:
    src: 01-hardening.conf
    dest: /etc/ssh/sshd_config.d/
    mode: '0644'
  notify: restart hardening

- name: dowload apt
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: fail2ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: '0644'
  notify: restart fail2ban

- name: run fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  
